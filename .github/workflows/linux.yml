# Linux build of Crux: an AppImage (updates itself) and a .deb.
# Runs for every published release (and attaches both files to it), or by
# hand from the Actions tab to just check that Linux still builds.
name: Linux build

on:
  release:
    types: [published]
  workflow_dispatch:
  # Work on the Linux port: every push to the `linux` branch builds.
  push:
    branches: [linux]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy (AppImage) without FUSE, and without stripping newer libs.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: System packages (WebKitGTK, tray, node-pty build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf libfuse2 build-essential python3 file

      # Also compiles node-pty (it has no Linux prebuilds).
      - run: npm ci

      # scripts/bundle-server.mjs smoke-tests the bundled server + node-pty.
      - name: Build (server bundle, UI, AppImage + .deb)
        run: npm run app:build

      - uses: actions/upload-artifact@v4
        with:
          name: crux-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" --clobber \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/deb/*.deb
